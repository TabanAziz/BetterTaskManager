[package]
name = "btm-setup"
description = "Per-user setup for Better Task Manager"
version = "1.1.1"
authors = ["TabanAziz"]
license = "MIT"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace]

[[bin]]
name = "BTM-Setup"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
